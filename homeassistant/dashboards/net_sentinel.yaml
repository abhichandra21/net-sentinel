  # ===========================================================================
  # RUNBOOK - what each code means and what to do. Replaces the old hover
  # tooltips, which never worked on the phone anyway.
  # ===========================================================================
  - title: Runbook
    path: runbook
    icon: mdi:book-open-variant
    theme: Net Sentinel
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 1
        cards:
          - type: markdown
            card_mod: *plate
            content: |
              #### How attribution works

              Each probe isolates one segment of the path, so the pattern of failures localises the fault. Router up but gateway unreachable means the last mile. Gateway reachable but nothing public resolving means ISP core. Everything public failing while our own VPS anchor still answers means the problem is not our uplink at all.

              Codes are ordered by specificity and the first match wins, so a direct observation from the gateway always beats an inference drawn from probes.

              ---

              #### Your equipment

              | Code | Meaning |
              | --- | --- |
              | ROUTER_DOWN | Router will not answer ping. Checked first, so a failing health probe cannot mask it. |
              | ROUTER_CRITICAL | Health score under 30. Failing, not just slow. |
              | ROUTER_DEGRADED | Score under 60 while public checks are fine. |

              #### The fiber gateway

              | Code | Meaning |
              | --- | --- |
              | FIBER_LINK_DOWN | The BGW620 reports optical WAN down. Confidence 0.95, the strongest signal there is. |
              | MODEM_DOWN | Gateway unreachable while the router is up. |

              #### The ISP

              | Code | Meaning |
              | --- | --- |
              | LASTMILE_FIBER_SUSPECT | First hop dark, no proof the gateway is down. |
              | ISP_INGRESS_CONGEST | First-hop latency over threshold. Slow, not broken. |
              | ISP_CORE_ROUTING | First hop answers, public does not. |
              | ISP_ROUTING | DNS and HTTP both fully failed. |
              | ISP_DNS | Every resolver failed, path intact. |

              #### Degradation

              | Code | Meaning |
              | --- | --- |
              | DEGRADED_DNS | Some lookups failed, not all. |
              | DEGRADED_INTERNET | Some endpoints unreachable while the anchor answers. |
              | DEGRADED_QUALITY | Jitter over threshold. |
              | TRANSIENT | Failed, then recovered before it could be pinned down. |

      - type: grid
        column_span: 1
        cards:
          - type: markdown
            card_mod: *plate
            content: |
              #### Reading the numbers

              | Metric | What it tells you |
              | --- | --- |
              | Router RTT | Ping to 192.168.1.1. High means the router or Wi-Fi is the bottleneck, before the internet is involved. |
              | Gateway RTT | Ping to the BGW620, smoothed over 5 samples, so it lags reality by up to 3 ticks. Do not read it as instantaneous. |
              | ISP hop | First hop past the gateway, auto-detected at startup. If detection failed, ISP attribution is disabled for that process. |
              | DNS | Resolution time across 4 domains on the configured resolvers. |
              | HTTP | End-to-end fetch of 4 public endpoints. The user-facing number. |
              | Path jitter | Standard deviation of the last 10 router pings. ICMP only, never HTTP timings. Drives DEGRADED_QUALITY. |
              | Local jitter | Spread across the 5 pings of one router-health probe. |
              | Throughput | Comes from the Cloudflare Speed Test integration on the Home Assistant box, not from the sentinel. See below. |
              | Rx / Tx power | Optical power at the transceiver in microwatts, with the dBm equivalent alongside. |

              ---

              #### Why throughput is not measured by the sentinel

              The sentinel runs on a Raspberry Pi 4, which has no AES hardware
              acceleration, so TLS is encrypted and decrypted in software. That
              caps a single HTTPS stream at roughly 250 Mbps: measured
              AES-128-GCM on the Pi is 246 Mbps against 10.6 Gbps on the Home
              Assistant box, a 43x difference.

              So the sentinel's old "download speed" reported about 213 Mbps on
              a line that actually delivers 690 down and 904 up. It was
              measuring the Pi's crypto ceiling, not the internet. Plaintext
              LAN throughput to the Pi is 900 Mbps, so the network was never
              the problem.

              The same limit broke the load classifier: bufferbloat was measured
              by generating load from the Pi, and a host that caps near 345 Mbps
              cannot saturate a 700 Mbps uplink, so DEGRADED_UNDER_LOAD could
              never fire honestly. Both probes were removed rather than left to
              report numbers that look like faults.

              Throughput now comes from the Cloudflare Speed Test integration
              running on Home Assistant itself, every 8 hours.

              ---

              #### Colour

              | Slot | Meaning |
              | --- | --- |
              | `cyan` | In range. |
              | *amber* | Degraded but carrying traffic. |
              | **red** | Outage. Used for nothing else. |
              | ~~slate~~ | No data, or deliberately not measured. Not the same as zero. |
