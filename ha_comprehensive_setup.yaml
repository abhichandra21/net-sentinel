# Comprehensive Internet Monitor - Home Assistant Setup
# Updated with Router Health Monitoring and Enhanced Fault Attribution

# MQTT Sensors Configuration
# Add to mqtt.yaml or create mqtt: section in configuration.yaml

mqtt:
  sensor:
    # ============================================================================
    # PRIMARY STATUS
    # ============================================================================
    - name: "Internet Status"
      state_topic: "home/network/sentinel/status/state"
      icon: mdi:web-check
      unique_id: internet_status
      # Values: HEALTHY, OUTAGE_*, DEGRADED_*

    - name: "Internet Fault Blame"
      state_topic: "home/network/sentinel/blame/state"
      icon: mdi:flash-alert
      unique_id: internet_fault_blame
      # WHO IS TO BLAME?
      # Possible values:
      # - NONE (healthy)
      # - ROUTER_CRITICAL (router health < 30/100)
      # - ROUTER_DEGRADED (router health < 60/100)
      # - ROUTER_DOWN (router not responding)
      # - FIBER_LINK_DOWN (BGW620 directly reports optical WAN is down)
      # - MODEM_DOWN (fiber gateway unreachable while router is up)
      # - LASTMILE_FIBER_SUSPECT (first-hop/last-mile failure without proof gateway is down)
      # - ISP_INGRESS_CONGEST (slow ISP first hop)
      # - ISP_CORE_ROUTING (upstream ISP routing failure)
      # - ISP_DNS (ISP DNS servers down)
      # - ISP_ROUTING (ISP routing/connection issue)
      # - DEGRADED_DNS (partial DNS failure)
      # - DEGRADED_INTERNET (partial connectivity)
      # - DEGRADED_QUALITY (high jitter >50ms)
      # - TRANSIENT (temporary issue)

    - name: "Internet Fault Detail"
      state_topic: "home/network/sentinel/fault_detail/state"
      icon: mdi:text-box-outline
      unique_id: internet_fault_detail

    # ============================================================================
    # ROUTER HEALTH (NEW)
    # ============================================================================
    - name: "Router Health Score"
      state_topic: "home/network/sentinel/router_health_score/state"
      unit_of_measurement: ""
      icon: mdi:heart-pulse
      unique_id: router_health_score
      # 0-100 score based on packet loss, latency, jitter
      # ≥80 = healthy, 60-79 = degraded, <60 = critical

    - name: "Router Packet Loss"
      state_topic: "home/network/sentinel/router_packet_loss/state"
      unit_of_measurement: "%"
      icon: mdi:package-down
      unique_id: router_packet_loss
      # Should be 0%, any packet loss indicates router issues

    - name: "Router Jitter Internal"
      state_topic: "home/network/sentinel/router_jitter_internal/state"
      unit_of_measurement: "ms"
      icon: mdi:sine-wave
      device_class: duration
      unique_id: router_jitter_internal
      # Should be < 2ms, measures latency variance to router

    # ============================================================================
    # LATENCY METRICS
    # ============================================================================
    - name: "Internet Modem Status"
      state_topic: "home/network/sentinel/modem_status/state"
      icon: mdi:modem
      unique_id: internet_modem_status
      # Values: REACHABLE, UNREACHABLE, NOT_CONFIGURED

    - name: "Internet Modem Latency"
      state_topic: "home/network/sentinel/modem_latency/state"
      availability_topic: "home/network/sentinel/modem_latency/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "ms"
      icon: mdi:modem
      device_class: duration
      unique_id: internet_modem_latency

    # ============================================================================
    # BGW620 GATEWAY DIRECT OBSERVATION (fiber ONT scrape)
    # ============================================================================
    - name: "Gateway WAN State"
      state_topic: "home/network/sentinel/modem_wan_state/state"
      icon: mdi:wan
      unique_id: gateway_wan_state
      # Values: up, down, UNAVAILABLE

    - name: "Gateway Fiber State"
      state_topic: "home/network/sentinel/modem_fiber_state/state"
      icon: mdi:fiber-node
      unique_id: gateway_fiber_state
      # Values: up, down, UNAVAILABLE

    - name: "Gateway WAN IP"
      state_topic: "home/network/sentinel/modem_wan_ip/state"
      icon: mdi:ip
      unique_id: gateway_wan_ip

    - name: "Gateway Rx Power"
      state_topic: "home/network/sentinel/modem_rx_power_uw/state"
      availability_topic: "home/network/sentinel/modem_rx_power_uw/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "uW"
      icon: mdi:signal
      state_class: measurement
      unique_id: gateway_rx_power_uw

    - name: "Gateway Tx Power"
      state_topic: "home/network/sentinel/modem_tx_power_uw/state"
      availability_topic: "home/network/sentinel/modem_tx_power_uw/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "uW"
      icon: mdi:signal-variant
      state_class: measurement
      unique_id: gateway_tx_power_uw

    - name: "Gateway Transceiver Temperature"
      state_topic: "home/network/sentinel/modem_temp_c/state"
      availability_topic: "home/network/sentinel/modem_temp_c/availability"
      payload_available: "online"
      payload_not_available: "offline"
      unit_of_measurement: "°C"
      icon: mdi:thermometer
      device_class: temperature
      state_class: measurement
      unique_id: gateway_temp_c

    - name: "Gateway Optical Last Change"
      state_topic: "home/network/sentinel/modem_last_change/state"
      availability_topic: "home/network/sentinel/modem_last_change/availability"
      payload_available: "online"
      payload_not_available: "offline"
      icon: mdi:clock-outline
      device_class: timestamp
      unique_id: gateway_last_change

    - name: "Gateway Probe Status"
      state_topic: "home/network/sentinel/modem_probe_status/state"
      icon: mdi:cog-sync
      unique_id: gateway_probe_status
      # Values: ok, partial, failed, disabled

    - name: "Internet Router Latency"
      state_topic: "home/network/sentinel/router_latency/state"
      unit_of_measurement: "ms"
      icon: mdi:router-wireless
      device_class: duration
      unique_id: internet_router_latency

    - name: "Internet DNS Latency"
      state_topic: "home/network/sentinel/dns_latency/state"
      unit_of_measurement: "ms"
      icon: mdi:dns
      device_class: duration
      unique_id: internet_dns_latency

    - name: "Internet HTTP Latency"
      state_topic: "home/network/sentinel/http_latency/state"
      unit_of_measurement: "ms"
      icon: mdi:web
      device_class: duration
      unique_id: internet_http_latency

    - name: "Internet Jitter"
      state_topic: "home/network/sentinel/jitter/state"
      unit_of_measurement: "ms"
      icon: mdi:waveform
      device_class: duration
      unique_id: internet_jitter
      # High jitter (>50ms) indicates unstable connection

    # ============================================================================
    # SUCCESS RATES
    # ============================================================================
    - name: "Internet DNS Success Rate"
      state_topic: "home/network/sentinel/dns_success_rate/state"
      icon: mdi:check-network
      unique_id: internet_dns_success_rate
      # Format: "4/4" (successful/total)

    - name: "Internet HTTP Success Rate"
      state_topic: "home/network/sentinel/http_success_rate/state"
      icon: mdi:check-network
      unique_id: internet_http_success_rate
      # Format: "4/4" (successful/total)

# ============================================================================
# AUTOMATION EXAMPLES
# ============================================================================

# Automation: Alert on Router Issues
automation:
  - alias: "Alert: Router Health Critical"
    description: "Alert when router health drops below 60/100"
    trigger:
      - platform: numeric_state
        entity_id: sensor.router_health_score
        below: 60
    action:
      - service: notify.mobile_app
        data:
          title: "🔧 Router Health Critical"
          message: >
            Router health score: {{ states('sensor.router_health_score') }}/100
            Packet Loss: {{ states('sensor.router_packet_loss') }}%
            Jitter: {{ states('sensor.router_jitter_internal') }}ms
          data:
            priority: high

  - alias: "Alert: ISP Issue Detected"
    description: "Alert when ISP is at fault"
    trigger:
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "MODEM_DOWN"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ISP_DNS"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ISP_ROUTING"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "LASTMILE_FIBER_SUSPECT"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "FIBER_LINK_DOWN"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ISP_INGRESS_CONGEST"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ISP_CORE_ROUTING"
    action:
      - service: notify.mobile_app
        data:
          title: "📞 ISP Issue Detected"
          message: "{{ states('sensor.internet_fault_detail') }}"
          data:
            priority: high

  - alias: "Alert: Router Down"
    description: "Alert when router is completely down"
    trigger:
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ROUTER_DOWN"
      - platform: state
        entity_id: sensor.internet_fault_blame
        to: "ROUTER_CRITICAL"
    action:
      - service: notify.mobile_app
        data:
          title: "⚠️ Router Issue"
          message: "{{ states('sensor.internet_fault_detail') }} - Check router power and reboot"
          data:
            priority: high
